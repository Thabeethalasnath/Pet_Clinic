server:
  port: ${PORT:8080}

spring:
  application:
    name: pawfectly-backend

  datasource:
    # Supports custom DB_URL, Railway MYSQL_URL / DATABASE_URL, or local fallback
    url: ${DB_URL:${MYSQL_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/pawfectly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}}}
    username: ${DB_USERNAME:${MYSQL_USER:${MYSQLUSER:root}}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:${MYSQLPASSWORD:12345}}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    ignore-missing-migrations: true
    out-of-order: true

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    # Generate a real secret for prod: openssl rand -base64 64
    secret: ${JWT_SECRET:replace-this-with-a-long-random-base64-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION:${JWT_EXPIRATION_MS:86400000}} # 24h

  cors:
    allowed-origins: ${CORS_ORIGINS:https://kss-petshop-official.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:3001}
